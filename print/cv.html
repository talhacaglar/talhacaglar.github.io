  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body {

    color: var(--ink);
    font-family: Arial, "Liberation Sans", Helvetica, sans-serif;
    font-size: 8.9pt;
    line-height: 1.36;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  a { color: inherit; text-decoration: none; }

  header { padding-bottom: 3.2mm; border-bottom: 1.4pt solid var(--ink); }
  .name-row { display: flex; justify-content: space-between; align-items: baseline; }
  .location { font-size: 8.6pt; color: var(--soft); }
  h1 { font-size: 22pt; letter-spacing: 0.04em; line-height: 1; font-weight: 700; }
  .headline { margin-top: 1.8mm; font-size: 10.4pt; font-weight: 700; color: var(--accent); }
  .contact { display: flex; flex-wrap: wrap; row-gap: 0.6mm; margin-top: 1.8mm; font-size: 8.4pt; color: var(--soft); }
  .contact span { white-space: nowrap; }
  .contact span + span::before { content: "·"; margin: 0 1.3mm; color: var(--mute); }

  section { margin-top: 3.4mm; }
  h2 {
    display: flex; align-items: center; gap: 2.4mm;
    margin-bottom: 1.8mm;
    font-size: 8.6pt; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink);
  }
  h2::before { content: ""; width: 5mm; height: 1.4pt; background: var(--accent); }
  h2::after { content: ""; flex: 1; height: 0.6pt; background: var(--rule); }

  .summary { color: var(--soft); }

  .entry + .entry { margin-top: 2.1mm; }
  .entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4mm; }
  .entry-title { font-weight: 700; font-size: 9.6pt; }
  .entry-title em { font-style: normal; font-weight: 400; color: var(--soft); }
  .entry-meta { flex: none; font-size: 8.4pt; color: var(--mute); white-space: nowrap; }
  .entry-sub { font-size: 8.4pt; color: var(--mute); }
  ul.points { margin-top: 0.9mm; padding-left: 4mm; }
  ul.points li { margin-top: 0.5mm; padding-left: 0.6mm; }
  ul.points li::marker { color: var(--accent); content: "▪  "; font-size: 7pt; }

  .projects .entry + .entry { margin-top: 1.7mm; }
  .project-line { color: var(--soft); }
  .project-line b { color: var(--ink); }
  .stack { color: var(--mute); }

  dl.skills { display: grid; grid-template-columns: 34mm 1fr; row-gap: 1mm; }
  dl.skills dt { font-weight: 700; }
  dl.skills dd { color: var(--soft); }

  .certs .entry + .entry { margin-top: 1.1mm; }
  .certs .entry-title { font-size: 9.1pt; }
  .id { color: var(--mute); font-weight: 400; }
</style>

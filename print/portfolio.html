<style>
  @page { size: A4; margin: 0; }
  :root {
    --paper: #f5f4f0;
    --card: #ffffff;
    --ink: #161a18;
    --soft: #434b47;
    --mute: #6f7873;
    --rule: #d8dad5;
    --accent: #9a6239;
    --accent-soft: #f1e7de;
    --night: #111312;
    --night-2: #1b1e1c;
    --chalk: #eeeee9;
    --steel: #9aa39d;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Manrope", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--paper); }
  body { color: var(--ink); font-family: var(--body); font-size: 9.4pt; line-height: 1.5; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }

  .page { position: relative; width: 210mm; height: 297mm; overflow: hidden; padding: 16mm 16mm 20mm; break-after: page; background: var(--paper); }
  .page:last-child { break-after: auto; }

  .folio { position: absolute; left: 16mm; right: 16mm; bottom: 9mm; display: flex; justify-content: space-between; border-top: 0.6pt solid var(--rule); padding-top: 2.4mm; font-family: var(--mono); font-size: 6.6pt; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); }

  .kicker { display: flex; align-items: center; gap: 2.6mm; font-family: var(--mono); font-size: 7.2pt; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
  .kicker::before { content: ""; width: 7mm; height: 1.4pt; background: currentColor; }
  h2.title { margin-top: 5mm; font-family: var(--display); font-size: 46pt; font-weight: 700; line-height: 0.86; letter-spacing: -0.02em; text-transform: uppercase; }
  .lead { margin-top: 5mm; max-width: 150mm; font-size: 10.6pt; line-height: 1.55; color: var(--soft); }
  .label { font-family: var(--mono); font-size: 6.8pt; font-weight: 600; letter-spacing: 0.13em; text-transform: uppercase; color: var(--accent); }
  .tags { display: flex; flex-wrap: wrap; gap: 1.6mm; }
  .tags span { border: 0.6pt solid var(--rule); background: var(--card); padding: 0.8mm 2.2mm; font-family: var(--mono); font-size: 6.8pt; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--soft); }

  /* Cover */
  .cover { background: var(--night); color: var(--chalk); padding: 0; }
  .cover-grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(238,238,233,.045) 1px, transparent 1px), linear-gradient(to bottom, rgba(238,238,233,.035) 1px, transparent 1px); background-size: 21mm 21mm; }
  .cover-inner { position: relative; height: 100%; display: flex; flex-direction: column; padding: 16mm; }
  .cover-top { display: flex; justify-content: space-between; border-bottom: 0.6pt solid rgba(238,238,233,.16); padding-bottom: 4mm; font-family: var(--mono); font-size: 7.2pt; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
  .cover-top b { color: var(--accent-cover, #c08a5f); font-weight: 600; }
  .cover h1 { margin-top: 28mm; font-family: var(--display); font-size: 104pt; font-weight: 800; line-height: 0.8; letter-spacing: -0.04em; text-transform: uppercase; }
  .cover h1 span { display: block; color: #b47e55; }
  .cover-bar { position: absolute; right: 16mm; top: 25mm; width: 4mm; height: 34mm; background: #b47e55; }
  .cover-headline { margin-top: 12mm; max-width: 150mm; font-family: var(--display); font-size: 25pt; font-weight: 600; line-height: 1.05; }
  .cover-intro { margin-top: 5mm; max-width: 140mm; font-size: 10.4pt; line-height: 1.6; color: #c5cac6; }
  .cover-focus { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 0.6pt solid rgba(238,238,233,.16); border-left: 0.6pt solid rgba(238,238,233,.16); }
  .cover-focus div { border-right: 0.6pt solid rgba(238,238,233,.16); border-bottom: 0.6pt solid rgba(238,238,233,.16); padding: 5mm; }
  .cover-focus b { display: block; font-family: var(--mono); font-size: 6.8pt; color: #b47e55; letter-spacing: 0.14em; }
  .cover-focus strong { display: block; margin-top: 3mm; font-family: var(--display); font-size: 17pt; font-weight: 700; line-height: 0.95; text-transform: uppercase; }
  .cover-focus p { margin-top: 2mm; font-size: 8pt; line-height: 1.5; color: var(--steel); }
  .cover-contact { margin-top: 6mm; display: flex; flex-wrap: wrap; gap: 2mm 6mm; font-family: var(--mono); font-size: 7.6pt; letter-spacing: 0.04em; color: #c5cac6; }

  /* Profile page */
  .facts { margin-top: 8mm; display: grid; grid-template-columns: repeat(4, 1fr); border-top: 0.6pt solid var(--rule); border-left: 0.6pt solid var(--rule); }
  .facts div { border-right: 0.6pt solid var(--rule); border-bottom: 0.6pt solid var(--rule); background: var(--card); padding: 4.5mm; }
  .facts strong { display: block; font-family: var(--display); font-size: 30pt; font-weight: 700; line-height: 0.9; }
  .facts span { display: block; margin-top: 1.5mm; font-family: var(--mono); font-size: 6.6pt; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
  .timeline { margin-top: 8mm; }
  .role { display: grid; grid-template-columns: 38mm 1fr; gap: 6mm; padding: 4.2mm 0; border-top: 0.6pt solid var(--rule); }
  .role:last-child { border-bottom: 0.6pt solid var(--rule); }
  .role-date { font-family: var(--mono); font-size: 7pt; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); }
  .role-date i { display: block; margin-top: 1.2mm; font-style: normal; color: var(--accent); }
  .role h3 { font-family: var(--display); font-size: 17pt; font-weight: 700; line-height: 1; text-transform: uppercase; }
  .role h3 em { font-style: normal; font-family: var(--body); font-size: 9pt; font-weight: 600; text-transform: none; color: var(--soft); margin-left: 1.5mm; }
  .role p { margin-top: 1.6mm; color: var(--soft); }
  .edu { margin-top: 7mm; display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
  .edu div { background: var(--card); border: 0.6pt solid var(--rule); padding: 4.5mm; }
  .edu strong { display: block; margin-top: 2mm; font-family: var(--display); font-size: 15pt; font-weight: 700; line-height: 1; text-transform: uppercase; }
  .edu p { margin-top: 1.5mm; font-size: 8.4pt; color: var(--soft); }

  /* Project pages */
  .project-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 8mm; }
  .project-head .title { margin-top: 4mm; font-size: 58pt; }
  .repo { flex: none; border: 0.6pt solid var(--ink); padding: 2mm 3mm; font-family: var(--mono); font-size: 7pt; font-weight: 600; letter-spacing: 0.08em; }
  .meta-row { margin-top: 4mm; display: flex; justify-content: space-between; gap: 6mm; padding: 2.4mm 0; border-top: 0.6pt solid var(--rule); border-bottom: 0.6pt solid var(--rule); font-family: var(--mono); font-size: 7pt; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mute); }
  .shot { border: 0.6pt solid #2a2f2c; background: #0b0d10; box-shadow: 0 3mm 7mm -4mm rgba(0,0,0,.35); }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
  .shots { margin-top: 5mm; display: grid; gap: 3.5mm; }
  .caption { margin-top: 1.6mm; font-family: var(--mono); font-size: 6.4pt; letter-spacing: 0.06em; color: var(--mute); }
  .psr { margin-top: 5mm; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 0.6pt solid var(--rule); border-left: 0.6pt solid var(--rule); }
  .psr div { border-right: 0.6pt solid var(--rule); border-bottom: 0.6pt solid var(--rule); background: var(--card); padding: 4mm; }
  .psr p { margin-top: 2mm; font-size: 8.4pt; line-height: 1.5; color: var(--soft); }
  .highlights { margin-top: 5mm; display: grid; grid-template-columns: 1fr 1fr; gap: 2.2mm 7mm; }
  .highlights li { list-style: none; display: grid; grid-template-columns: 3mm 1fr; gap: 2mm; font-size: 8.6pt; color: var(--soft); }
  .highlights li::before { content: ""; width: 1.5mm; height: 1.5mm; margin-top: 1.9mm; background: var(--accent); }
  .bottom { margin-top: 6mm; }
  .split { margin-top: 4mm; display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; align-items: start; }
  .split .highlights { margin-top: 0; grid-template-columns: 1fr; gap: 2.6mm; }

  /* Diagram */
  .diagram { margin-top: 6mm; background: var(--night); color: var(--chalk); padding: 12mm 8mm; display: grid; grid-template-columns: 1fr 9mm 1fr 9mm 1fr; align-items: center; row-gap: 4mm; }
  .node { border: 0.6pt solid rgba(238,238,233,.22); background: var(--night-2); padding: 4mm; }
  .node b { display: block; font-family: var(--mono); font-size: 6.4pt; letter-spacing: 0.12em; color: #b47e55; text-transform: uppercase; }
  .node strong { display: block; margin-top: 1.6mm; font-family: var(--display); font-size: 14pt; line-height: 1; text-transform: uppercase; }
  .node span { display: block; margin-top: 1.2mm; font-size: 7.4pt; color: var(--steel); line-height: 1.4; }
  .node.accent { border-color: #b47e55; }
  .arrow { height: 0.8pt; background: #b47e55; position: relative; }
  .arrow::after { content: ""; position: absolute; right: -0.4mm; top: -1.2mm; border-left: 2.2mm solid #b47e55; border-top: 1.3mm solid transparent; border-bottom: 1.3mm solid transparent; }
  .stack-col { display: grid; gap: 3mm; }

  /* Certificates */
  .certs { margin-top: 6mm; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; }
  .cert { background: var(--card); border: 0.6pt solid var(--rule); }
  .cert .img { aspect-ratio: 1.414 / 1; overflow: hidden; border-bottom: 0.6pt solid var(--rule); background: #fff; }
  .cert .img img { width: 100%; height: 100%; object-fit: cover; }
  .cert div.body { padding: 3mm 3.4mm 3.4mm; }
  .cert strong { display: block; margin-top: 1.4mm; font-family: var(--display); font-size: 12.5pt; font-weight: 700; line-height: 1; text-transform: uppercase; }
  .cert p { margin-top: 1.2mm; font-size: 7.4pt; color: var(--mute); }
  .cert.wide { grid-column: span 2; display: grid; grid-template-columns: 1.1fr 1fr; }
  .cert.wide .img { border-bottom: 0; border-right: 0.6pt solid var(--rule); aspect-ratio: auto; display: flex; align-items: center; background: #f2f3f5; }
  .cert.wide .img img { height: auto; object-fit: contain; }
  .cert.wide div.body { padding: 5mm; display: flex; flex-direction: column; }
  .cert.wide strong { font-size: 19pt; }
  .cert.wide p { font-size: 8.4pt; color: var(--soft); }

  .sec-grid { margin-top: 7mm; display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
  .sec-card { background: var(--night); color: var(--chalk); padding: 5mm; }
  .sec-card strong { display: block; margin-top: 2mm; font-family: var(--display); font-size: 18pt; font-weight: 700; line-height: 0.95; text-transform: uppercase; }
  .sec-card .when { margin-top: 1.4mm; font-family: var(--mono); font-size: 6.8pt; letter-spacing: 0.08em; color: var(--steel); text-transform: uppercase; }
  .sec-card p { margin-top: 2.6mm; font-size: 8.4pt; color: #c5cac6; line-height: 1.5; }
  .sec-card .label { color: #b47e55; }

  /* More projects */
  .cards { margin-top: 5mm; display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
  .card { background: var(--card); border: 0.6pt solid var(--rule); padding: 4.5mm; display: flex; flex-direction: column; }
  .card strong { display: block; margin-top: 1.8mm; font-family: var(--display); font-size: 18pt; font-weight: 700; line-height: 0.95; text-transform: uppercase; }
  .card p { margin-top: 2mm; font-size: 8.3pt; color: var(--soft); line-height: 1.5; }
  .card .tags { margin-top: auto; padding-top: 3mm; }
  .card .shot { margin-top: 3mm; height: 30mm; }
  .card.span2 { grid-column: span 2; }
  .flow { margin-top: 3mm; display: grid; grid-template-columns: 1fr 6mm 1fr 6mm 1fr 6mm 1fr; align-items: center; }
  .flow .node { padding: 2.6mm; }
  .flow .node strong { font-size: 11.5pt; }
  .flow-wrap { background: var(--night); color: var(--chalk); padding: 4mm; margin-top: 3mm; }

  .contact-band { position: absolute; left: 16mm; right: 16mm; bottom: 19mm; background: var(--night); color: var(--chalk); padding: 5mm 6mm; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 6mm; }
  .contact-band strong { display: block; font-family: var(--display); font-size: 30pt; font-weight: 800; line-height: 0.9; text-transform: uppercase; }
  .contact-band ul { list-style: none; font-family: var(--mono); font-size: 7.6pt; line-height: 1.9; text-align: right; color: #c5cac6; }
</style>
</head>
